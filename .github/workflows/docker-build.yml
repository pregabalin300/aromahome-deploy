name: Validate Docker Compose

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch: # Позволяет запускать вручную

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dummy .env for build
        run: |
          echo "DATABASE_URL=postgresql://dummy:dummy@localhost:5432/dummy" > .env
          # Создаем пустые сертификаты, чтобы Nginx не ругался при проверке конфига
          mkdir -p certs
          touch certs/aromahome.localhost.pem
          touch certs/aromahome.localhost-key.pem

      - name: Validate docker-compose config
        run: docker compose config -q

      - name: Pull Docker images
        run: docker compose pull